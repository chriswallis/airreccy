<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACTO 104 Aircraft Recognition</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 28px 20px 45px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 4vw, 35px);
    }

    #sub {
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 24px;
      background: #21262d;
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      border-color: #8b949e;
    }

    button.primary {
      background: var(--accent);
      color: #071018;
      border-color: var(--accent);
      font-weight: 700;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button[aria-disabled="true"] {
      opacity: .45;
      cursor: not-allowed;
    }

    .source-controls {
      align-items: center;
      color: var(--muted);
    }

    select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      background: #21262d;
      color: var(--text);
      font-size: 16px;
    }

    #photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .photo {
      aspect-ratio: 4/3;
      background: #080b0f;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    #photos.single {
      grid-template-columns: 1fr;
      max-width: 850px;
      margin-left: auto;
      margin-right: auto;
    }

    #photos.single .photo {
      aspect-ratio: 4/3;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .photo .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .photo a {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: #000b;
      color: #fff;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      text-decoration: none;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 50%;
      z-index: 10;
      width: min(800px, calc(100vw - 24px));
      margin: 0;
      max-width: 800px;
      transform: translateX(-50%);
      padding: 20px;
      text-align: center;
      background: #17241d;
      border: 1px solid #31533e;
      border-radius: 10px;
      box-shadow: 0 8px 24px #000b;
    }

    #closeInfo {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
    }

    #closeInfo:hover {
      color: var(--text);
    }

    #info.hidden {
      display: none;
    }

    #aircraft {
      margin: 0 0 8px;
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    .meta {
      color: #b5c0c9;
    }

    @media(max-width:750px) {
      #photos {
        grid-template-columns: 1fr;
      }

      .photo {
        aspect-ratio: 16/10;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>ACTO 104 Aircraft Recognition</h1>
    </header>

    <div class="controls source-controls">
      <select id="listSelect">
        <option value="either">List 1 + List 2</option>
        <option value="List 1">List 1</option>
        <option value="List 2">List 2</option>
      </select>
      <select id="photoCount">
        <option value="6">6 photos</option>
        <option value="1">1 photo</option>
      </select>
      <button id="reveal" class="primary">Reveal</button>
      <button id="next">Next</button>
    </div>

    <section id="photos" aria-live="polite"></section>
    <section id="info" class="hidden">
      <button id="closeInfo" type="button" aria-label="Close reveal">×</button>
      <h2 id="aircraft"></h2>
      <div id="details" class="meta"></div>
    </section>
  </main>

  <script>
    const aircraftUrl = "aircraft.json";
    let aircraft = [];

    async function loadAircraft() {
      try {
        const response = await fetch(aircraftUrl);
        if (!response.ok) {
          throw new Error(`Failed to load aircraft data: ${response.status}`);
        }
        const data = await response.json();
        aircraft = data.flatMap(section => section.groups.flatMap(group =>
          group.aircraft.map(item => ({
            ...item,
            list: section.list,
            group: group.number,
            groupDescription: group.description,
            searchName: [item.manufacturer, item.additional, item.aircraft, "aircraft"]
              .filter(Boolean)
              .join(" ")
          }))
        ));
        chooseRandom();
      } catch (error) {
        console.error(error);
        document.getElementById("photos").innerHTML =
          '<div class="loading">Unable to load aircraft data.</div>';
      }
    }

    let current = null;
    let revealed = false;

    function getPool() {
      if (!aircraft.length) return [];
      const choice = document.getElementById("listSelect").value;
      if (choice === "either") return aircraft;
      const selectedList = Number(choice.replace(/^List\s+/, ""));
      return aircraft.filter(a => Number(a.list) === selectedList);
    }

    function getPhotoCount() {
      return Number(document.getElementById("photoCount").value);
    }

    function chooseRandom(excluded = new Set()) {
      if (!aircraft.length) return;
      const pool = getPool();
      if (!pool.length) return;

      const available = pool.filter(item => !excluded.has(item));
      const choices = available.length ? available : pool;
      current = choices[Math.floor(Math.random() * choices.length)];
      const attempted = new Set(excluded);
      attempted.add(current);
      revealed = false;
      document.getElementById("info").classList.add("hidden");
      document.getElementById("reveal").setAttribute("aria-disabled", "false");
      loadImages(current, getPhotoCount(), attempted);
    }

    function renderPhoto(card, imageUrl, linkUrl, linkText, alt) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = alt;
      img.loading = "eager";
      img.referrerPolicy = "no-referrer";

      const link = document.createElement("a");
      link.href = linkUrl;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = linkText;

      card.innerHTML = "";
      card.appendChild(img);
      card.appendChild(link);
    }

    // Cached lookups avoid repeat network round-trips across page reloads
    // (the app has no server, so localStorage is the only caching option).
    const SEARCH_CACHE_TTL = 24 * 60 * 60 * 1000; // 1 day
    const IMAGE_CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 1 week

    function cacheRead(key) {
      try {
        const parsed = JSON.parse(localStorage.getItem(key));
        if (!parsed || Date.now() - parsed.time > parsed.ttl) return undefined;
        return parsed.value;
      } catch {
        return undefined;
      }
    }

    function cacheWrite(key, value, ttl) {
      try {
        localStorage.setItem(key, JSON.stringify({ time: Date.now(), ttl, value }));
      } catch {
        // Storage full/unavailable/private-mode: fall back to no caching.
      }
    }

    async function fetchWithTimeout(url, ms = 6000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function getCommonsImages(item, limit = 6) {
      const cacheKey = `airreccy:commons:${item.searchName}`;
      const cached = cacheRead(cacheKey);
      if (cached) return cached;

      const api =
        "https://commons.wikimedia.org/w/api.php" +
        "?action=query&generator=search&gsrnamespace=6" +
        `&gsrlimit=${limit}&prop=imageinfo&iiprop=url|extmetadata|mime` +
        "&iiurlwidth=800&format=json&origin=*";

      const url = api + "&gsrsearch=" + encodeURIComponent(item.searchName);
      const response = await fetchWithTimeout(url);
      if (!response.ok) throw new Error("Commons API request failed");
      const json = await response.json();

      const pages = Object.values(json.query?.pages || {});
      pages.sort((a, b) => (a.index ?? 999) - (b.index ?? 999));

      // Prefer ordinary raster photographs. Avoid SVG diagrams and other files
      // which are less useful for aircraft recognition.
      const images = pages.filter(page => {
        const info = page.imageinfo?.[0];
        const mime = (info?.mime || "").toLowerCase();
        return info && (!mime || mime.startsWith("image/jpeg") ||
          mime.startsWith("image/png") || mime.startsWith("image/webp"));
      }).map(page => {
        const info = page.imageinfo[0];
        return {
          imageUrl: info.thumburl || info.url,
          fileUrl: "https://commons.wikimedia.org/wiki/" +
            encodeURIComponent(page.title.replaceAll(" ", "_")),
          source: "Commons"
        };
      });

      cacheWrite(cacheKey, images, SEARCH_CACHE_TTL);
      return images;
    }

    async function getOpenverseImages(item, limit = 6) {
      const cacheKey = `airreccy:openverse:${item.searchName}`;
      const cached = cacheRead(cacheKey);
      if (cached) return cached;

      const url = "https://api.openverse.org/v1/images/" +
        `?page_size=${limit}&q=${encodeURIComponent(item.searchName)}`;
      const response = await fetchWithTimeout(url);
      if (!response.ok) throw new Error("Openverse API request failed");
      const json = await response.json();

      const images = (json.results || []).filter(result => result.thumbnail || result.url).map(result => ({
        imageUrl: result.thumbnail || result.url,
        fallbackImageUrl: result.thumbnail ? result.url : null,
        fileUrl: result.foreign_landing_url || result.url,
        source: "Openverse"
      }));

      cacheWrite(cacheKey, images, SEARCH_CACHE_TTL);
      return images;
    }

    function getUsableImage(image) {
      const cacheKey = `airreccy:usable:${image.imageUrl}`;
      const cached = cacheRead(cacheKey);
      if (cached === false) return Promise.resolve(null);
      if (typeof cached === "string") return Promise.resolve({ ...image, imageUrl: cached });

      return new Promise(resolve => {
        const probe = new Image();
        let fallbackTried = false;
        const timeout = setTimeout(() => {
          cacheWrite(cacheKey, false, IMAGE_CACHE_TTL);
          resolve(null);
        }, 5000);

        probe.referrerPolicy = "no-referrer";
        probe.onload = () => {
          clearTimeout(timeout);
          cacheWrite(cacheKey, probe.src, IMAGE_CACHE_TTL);
          resolve({ ...image, imageUrl: probe.src });
        };
        probe.onerror = () => {
          if (!fallbackTried && image.fallbackImageUrl) {
            fallbackTried = true;
            probe.src = image.fallbackImageUrl;
            return;
          }
          clearTimeout(timeout);
          cacheWrite(cacheKey, false, IMAGE_CACHE_TTL);
          resolve(null);
        };
        probe.src = image.imageUrl;
      });
    }

    function makeCards(count) {
      const photos = document.getElementById("photos");
      photos.innerHTML = "";
      photos.classList.toggle("single", count === 1);
      for (let i = 0; i < count; i++) {
        const card = document.createElement("div");
        card.className = "photo";
        card.innerHTML = `<div class="loading">Loading photo ${i + 1}…</div>`;
        photos.appendChild(card);
      }
      return photos.querySelectorAll(".photo");
    }

    async function loadImages(item, count, attempted) {
      const cards = makeCards(count);

      const results = await Promise.allSettled([
        getCommonsImages(item, 8),
        getOpenverseImages(item, 8)
      ]);
      if (item !== current) return;

      results.filter(result => result.status === "rejected")
        .forEach(result => console.error(result.reason));
      const images = results.filter(result => result.status === "fulfilled")
        .flatMap(result => result.value)
        .filter((image, index, all) =>
          all.findIndex(candidate => candidate.imageUrl === image.imageUrl) === index);

      const imagesBySource = new Map();
      images.forEach(image => {
        if (!imagesBySource.has(image.source)) imagesBySource.set(image.source, []);
        imagesBySource.get(image.source).push(image);
      });
      const orderedImages = [];
      const sourceImages = [...imagesBySource.values()];
      for (let index = 0; sourceImages.some(source => source[index]); index++) {
        sourceImages.forEach(source => {
          if (source[index]) orderedImages.push(source[index]);
        });
      }

      // Only probe as many candidates as are plausibly needed, plus a small
      // margin for failures, instead of validating every result up front.
      const candidateLimit = count === 1 ? 6 : Math.min(orderedImages.length, count + 6);
      const checkedImages = await Promise.all(
        orderedImages.slice(0, candidateLimit).map(getUsableImage)
      );
      if (item !== current) return;
      const usableImages = checkedImages.filter(Boolean);
      const used = count === 1
        ? (usableImages.length
          ? [usableImages[Math.floor(Math.random() * usableImages.length)]]
          : [])
        : usableImages.slice(0, count);

      if (!used.length && attempted.size < Math.min(getPool().length, 5)) {
        chooseRandom(attempted);
        return;
      }

      for (let i = 0; i < count; i++) {
        const card = cards[i];
        if (used[i]) {
          renderPhoto(card, used[i].imageUrl, used[i].fileUrl, `${used[i].source} ↗`, "Aircraft recognition photograph");
        } else {
          card.innerHTML = `<div class="loading">No inline photo found</div>`;
        }
      }

    }

    function reveal() {
      if (!current || revealed) return;
      revealed = true;

      const aircraftName = [current.manufacturer, current.additional, current.aircraft].filter(Boolean).join(" • ");
      document.getElementById("aircraft").textContent = aircraftName;

      document.getElementById("details").textContent =
        `List ${current.list} • Aircraft ${current.number}` +
        ` • Group ${current.group}: ${current.groupDescription}`;
      document.getElementById("info").classList.remove("hidden");
      document.getElementById("reveal").setAttribute("aria-disabled", "true");
    }

    function hideReveal() {
      document.getElementById("info").classList.add("hidden");
      document.getElementById("reveal").setAttribute("aria-disabled", "false");
      revealed = false;
    }

    document.getElementById("reveal").addEventListener("click", () => {
      if (revealed) {
        hideReveal();
      } else {
        reveal();
      }
    });
    document.getElementById("info").addEventListener("click", hideReveal);
    document.addEventListener("click", event => {
      const info = document.getElementById("info");
      const target = event.target;
      if (!info.classList.contains("hidden") &&
        !info.contains(target) && !(target instanceof Element && target.closest("#reveal"))) {
        hideReveal();
      }
    });
    document.getElementById("next").addEventListener("click", () => chooseRandom());
    document.getElementById("listSelect").addEventListener("change", () => {
      if (aircraft.length) chooseRandom();
    });
    document.getElementById("photoCount").addEventListener("change", () => {
      if (aircraft.length) chooseRandom();
    });

    loadAircraft();
  </script>
</body>

</html>
