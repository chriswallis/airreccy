<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACTO 104 Aircraft Recognition</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --border:#30363d;
  --text:#f0f3f6; --muted:#8b949e; --accent:#58a6ff;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
       font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { max-width:1200px; margin:auto; padding:28px 20px 45px; }
header { text-align:center; margin-bottom:24px; }
h1 { margin:0 0 6px; font-size:clamp(26px,4vw,40px); }
#sub { color:var(--muted); }
.controls { display:flex; justify-content:center; gap:10px; margin:20px 0; }
button { border:1px solid var(--border); border-radius:8px; padding:11px 24px;
          background:#21262d; color:var(--text); font-size:16px; cursor:pointer; }
button:hover { border-color:#8b949e; }
button.primary { background:var(--accent); color:#071018; border-color:var(--accent); font-weight:700; }
button:disabled { opacity:.45; cursor:not-allowed; }
.source-controls { align-items:center; color:var(--muted); }
select { border:1px solid var(--border); border-radius:8px; padding:10px 14px;
         background:#21262d; color:var(--text); font-size:16px; }
#photos { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.photo { aspect-ratio:4/3; background:#080b0f; border:1px solid var(--border);
          border-radius:10px; overflow:hidden; position:relative; }
.photo img { width:100%; height:100%; object-fit:contain; display:block; }
.photo .loading { position:absolute; inset:0; display:flex; align-items:center;
                    justify-content:center; color:var(--muted); }
.photo a { position:absolute; right:8px; bottom:8px; background:#000b;
            color:#fff; padding:5px 8px; border-radius:5px; font-size:12px;
            text-decoration:none; }
#info { margin:22px auto 0; max-width:800px; padding:20px; text-align:center;
         background:#17241d; border:1px solid #31533e; border-radius:10px; }
#info.hidden { display:none; }
#aircraft { margin:0 0 8px; font-size:28px; }
.meta { color:#b5c0c9; }
#status { text-align:center; color:var(--muted); min-height:24px; margin-bottom:10px; }
@media(max-width:750px) {
  #photos { grid-template-columns:1fr; }
  .photo { aspect-ratio:16/10; }
}
</style>
</head>
<body>
<main>
<header>
  <h1>ACTO 104 Aircraft Recognition</h1>
  <div id="sub">Can you identify the aircraft?</div>
</header>

<div class="controls source-controls">
  <label for="listSelect">Syllabus:</label>
  <select id="listSelect">
    <option value="either">List 1 + List 2</option>
    <option value="List 1">List 1</option>
    <option value="List 2">List 2</option>
  </select>
</div>

<div class="controls">
  <button id="reveal" class="primary">Reveal</button>
  <button id="next">Next</button>
</div>

<div id="status"></div>
<section id="photos" aria-live="polite"></section>

<section id="info" class="hidden">
  <h2 id="aircraft"></h2>
  <div id="details" class="meta"></div>
</section>
</main>

%20Stallion%20Sikorsky%20S-65%20/%20CH-53%20/%20MH-53%20/%20Pave%20Low&title=Special:MediaSearch&type=image"}, {"list": "List 2", "number": 118, "name": "Super Stallion Sikorsky S-80 / SH-53 / CH-53E", "group": "Group 12 (Helicopters)", "commons": "https://commons.wikimedia.org/w/index.php?search=Super%20Stallion%20Sikorsky%20S-80%20/%20SH-53%20/%20CH-53E&title=Special:MediaSearch&type=image"}];
let current = null;
let revealed = false;

function getPool() {
  const choice = document.getElementById("listSelect").value;
  return choice === "either" ? aircraft : aircraft.filter(a => a.list === choice);
}

function chooseRandom() {
  const pool = getPool();
  if (!pool.length) return;

  current = pool[Math.floor(Math.random() * pool.length)];
  revealed = false;
  document.getElementById("info").classList.add("hidden");
  document.getElementById("reveal").disabled = false;
  document.getElementById("status").textContent =
    `${current.list} • ACTO 104 No. ${current.number}`;

  loadImages(current);
}

function renderPhoto(card, imageUrl, linkUrl, linkText, alt) {
  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = alt;
  img.loading = "eager";
  img.referrerPolicy = "no-referrer";

  const link = document.createElement("a");
  link.href = linkUrl;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = linkText;

  card.innerHTML = "";
  card.appendChild(img);
  card.appendChild(link);
}

async function getCommonsImages(item, limit = 6) {
  const api =
    "https://commons.wikimedia.org/w/api.php" +
    "?action=query&generator=search&gsrnamespace=6" +
    `&gsrlimit=${limit}&prop=imageinfo&iiprop=url|extmetadata|mime` +
    "&iiurlwidth=1200&format=json&origin=*";

  const url = api + "&gsrsearch=" + encodeURIComponent(item.name);
  const response = await fetch(url);
  if (!response.ok) throw new Error("Commons API request failed");
  const json = await response.json();

  const pages = Object.values(json.query?.pages || {});
  pages.sort((a,b) => (a.index ?? 999) - (b.index ?? 999));

  // Prefer ordinary raster photographs. Avoid SVG diagrams and other files
  // which are less useful for aircraft recognition.
  return pages.filter(page => {
    const info = page.imageinfo?.[0];
    const mime = (info?.mime || "").toLowerCase();
    return info && (!mime || mime.startsWith("image/jpeg") ||
           mime.startsWith("image/png") || mime.startsWith("image/webp"));
  }).map(page => {
    const info = page.imageinfo[0];
    return {
      imageUrl: info.thumburl || info.url,
      fileUrl: "https://commons.wikimedia.org/wiki/" +
        encodeURIComponent(page.title.replaceAll(" ", "_")),
      source: "Commons"
    };
  });
}

async function getOpenverseImages(item, limit = 6) {
  const url = "https://api.openverse.org/v1/images/" +
    `?page_size=${limit}&q=${encodeURIComponent(item.name)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error("Openverse API request failed");
  const json = await response.json();

  return (json.results || []).filter(result => result.thumbnail || result.url).map(result => ({
    imageUrl: result.thumbnail || result.url,
    fallbackImageUrl: result.thumbnail ? result.url : null,
    fileUrl: result.foreign_landing_url || result.url,
    source: "Openverse"
  }));
}

function getUsableImage(image) {
  return new Promise(resolve => {
    const probe = new Image();
    let fallbackTried = false;
    const timeout = setTimeout(() => resolve(null), 8000);

    probe.referrerPolicy = "no-referrer";
    probe.onload = () => {
      clearTimeout(timeout);
      resolve({ ...image, imageUrl: probe.src });
    };
    probe.onerror = () => {
      if (!fallbackTried && image.fallbackImageUrl) {
        fallbackTried = true;
        probe.src = image.fallbackImageUrl;
        return;
      }
      clearTimeout(timeout);
      resolve(null);
    };
    probe.src = image.imageUrl;
  });
}

function makeCards(count = 3) {
  const photos = document.getElementById("photos");
  photos.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const card = document.createElement("div");
    card.className = "photo";
    card.innerHTML = `<div class="loading">Loading photo ${i + 1}…</div>`;
    photos.appendChild(card);
  }
  return photos.querySelectorAll(".photo");
}

async function loadImages(item) {
  const cards = makeCards(3);

  document.getElementById("status").textContent =
    `${item.list} • ACTO 104 No. ${item.number} • Searching Commons and Openverse…`;

  const results = await Promise.allSettled([
    getCommonsImages(item, 8),
    getOpenverseImages(item, 8)
  ]);
  if (item !== current) return;

  results.filter(result => result.status === "rejected")
    .forEach(result => console.error(result.reason));
  const images = results.filter(result => result.status === "fulfilled")
    .flatMap(result => result.value)
    .filter((image, index, all) =>
      all.findIndex(candidate => candidate.imageUrl === image.imageUrl) === index);

  const imagesBySource = new Map();
  images.forEach(image => {
    if (!imagesBySource.has(image.source)) imagesBySource.set(image.source, []);
    imagesBySource.get(image.source).push(image);
  });
  const orderedImages = [];
  const sourceImages = [...imagesBySource.values()];
  for (let index = 0; sourceImages.some(source => source[index]); index++) {
    sourceImages.forEach(source => {
      if (source[index]) orderedImages.push(source[index]);
    });
  }

  const checkedImages = await Promise.all(orderedImages.map(getUsableImage));
  if (item !== current) return;
  const used = checkedImages.filter(Boolean).slice(0, 3);

  for (let i = 0; i < 3; i++) {
    const card = cards[i];
    if (used[i]) {
      renderPhoto(card, used[i].imageUrl, used[i].fileUrl, `${used[i].source} ↗`, "Aircraft recognition photograph");
    } else {
      card.innerHTML = `<div class="loading">No inline photo found</div>`;
    }
  }

  const sources = [...new Set(used.map(image => image.source))].join(" and ");
  const sourceText = used.length === 3
    ? `Photos from ${sources}`
    : `${used.length}/3 photos found from Commons and Openverse`;

  document.getElementById("status").textContent =
    `${item.list} • ACTO 104 No. ${item.number} • ${sourceText}`;
}

function reveal() {
  if (!current || revealed) return;
  revealed = true;
  document.getElementById("aircraft").textContent = current.name;
  document.getElementById("details").textContent =
    `${current.list} • ACTO 104 No. ${current.number}` +
    (current.group ? ` • ${current.group}` : "");
  document.getElementById("info").classList.remove("hidden");
  document.getElementById("reveal").disabled = true;
}

document.getElementById("reveal").addEventListener("click", reveal);
document.getElementById("next").addEventListener("click", chooseRandom);
document.getElementById("listSelect").addEventListener("change", chooseRandom);

chooseRandom();
</script>
